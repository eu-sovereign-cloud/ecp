---
# Namespace for the "seca" tenant (hash of "seca")
#
# The gateway provisions this namespace on the first tenant-scoped write, so it is NOT
# hand-managed. It is declared here only so the storage SKU and image catalogs can be applied
# before the gateway is up. Nothing ever deletes a tenant namespace — there is no Tenant entity
# to cascade from — so the owner label below is cosmetic here; it just matches what the gateway
# would stamp. Only workspace and network child namespaces are torn down, by their controllers.
apiVersion: v1
kind: Namespace
metadata:
  name: 69e09dd4c334335d2f0a4a52c9ff87b76b0f9e1b147d62a5f2b8f965
  labels:
    secapi.cloud/tenant: seca

