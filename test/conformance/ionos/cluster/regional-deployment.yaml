apiVersion: apps/v1
kind: Deployment
metadata:
  name: regional-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regional-server
  template:
    metadata:
      labels:
        app: regional-server
    spec:
      # Allow 30s for SIGTERM → httpserver.Serve drain (25s) + process exit.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: registry.secapi.cloud/regional-server:latest
          env:
            - name: REGION
              value: "itbg-bergamo"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: regional-server-svc
spec:
  type: NodePort # Expose the service on a port on the node
  selector:
    app: regional-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
