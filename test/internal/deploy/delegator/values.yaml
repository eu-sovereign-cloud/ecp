# Test-stack values for the delegator.
#
# The plugin is set per deployment from PLUGIN_TYPE (dummy on KIND, aruba
# otherwise — see internal/scripts/deploy.sh), which also selects the RBAC the
# chart grants. Image repository, tag and pullPolicy come from the script, as
# does imagePullSecrets when the local context carries registry credentials.

# The test stack runs a region-scoped delegator: every suite fixture and every test-data
# CR carries this region, so a CR in any other one is never reconciled — see test/README.md.
regions:
  - itbg-bergamo
