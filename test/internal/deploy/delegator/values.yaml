# Test-stack values for the delegator.
#
# The plugin is set per deployment from PLUGIN_TYPE (dummy on KIND, aruba
# otherwise — see internal/scripts/deploy.sh), which also selects the RBAC the
# chart grants. Image repository, tag and pullPolicy come from the script, as
# does imagePullSecrets when the local context carries registry credentials.

# The test stack runs two region-scoped delegators, this one and ../delegator-two: every
# suite fixture and every regional test-data CR carries this region, so a CR in any other
# one is never reconciled here — region-two's are reconciled by the other deployment, and a
# CR in a region neither serves is reconciled by nobody. The region-less fixtures (regions,
# roles, role-assignments) are reconciled by no delegator at all — see test/README.md.
regions:
  - itbg-bergamo
