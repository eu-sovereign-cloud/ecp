# Test-stack values for the regional gateway, layered on ../gateway-values.yaml.
#
# One chart, two releases (ecp-global and ecp-regional): each disables the other
# gateway, so `make deploy-gateway-regional` still deploys only what the
# gateway-regional suite needs. Image repository, tag and pullPolicy are set by
# internal/scripts/deploy.sh — they follow whatever the local build produced.

gatewayGlobal:
  enabled: false

gatewayRegional:
  # The default region: what a request that names none is served as. Must match a region
  # in test-data/regions.yaml.
  region: itbg-bergamo
  # One deployment, two regions. region-two is reachable only under its
  # /regions/region-two prefix, which is what the multi-region suites drive; every other
  # request is still served as itbg-bergamo, so the rest of the suites are unaffected.
  regions:
    - itbg-bergamo
    - region-two
  service:
    type: NodePort
    nodePort: 30081
