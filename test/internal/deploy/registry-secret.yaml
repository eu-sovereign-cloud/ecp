# Pull secret for the registry the test images are pushed to, referenced by
# imagePullSecrets in the chart values. Applied into SYSTEM_NAMESPACE by
# internal/scripts/deploy.sh for every component, so one copy serves the whole
# stack. Inert on KIND, where images are side-loaded rather than pulled.
apiVersion: v1
kind: Secret
metadata:
  name: ecp-test-registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: 
