apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: conformance
  name: conformance
  namespace: e2e-ecp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conformance
  strategy: {}
  template:
    metadata:
      labels:
        app: conformance
    spec:
      serviceAccountName: conformance-sa
      imagePullSecrets:
      - name: conformance-registry-secret
      containers:
      - image: "##IMAGE_NAME##"
        name: e2e-ecp-conformance
        imagePullPolicy: Always
        # Values are rendered by scripts/conformance.sh from CONFORMANCE_* settings
        # so the same image can be pointed at any gateway/plugin and scenario set.
        env:
          - name: PROVIDER_REGION_V1
            value: "##PROVIDER_REGION_V1##"
          - name: PROVIDER_AUTHORIZATION_V1
            value: "##PROVIDER_AUTHORIZATION_V1##"
          - name: CLIENT_AUTH_TOKEN
            value: "##CLIENT_AUTH_TOKEN##"
          - name: CLIENT_TENANT
            value: "##CLIENT_TENANT##"
          - name: CLIENT_REGION
            value: "##CLIENT_REGION##"
          - name: SCENARIOS_FILTER
            value: "##SCENARIOS_FILTER##"
          - name: SCENARIOS_USERS
            value: "##SCENARIOS_USERS##"
          - name: SCENARIOS_CIDR
            value: "##SCENARIOS_CIDR##"
          - name: SCENARIOS_PUBLIC_IPS
            value: "##SCENARIOS_PUBLIC_IPS##"
        # Stay alive so scripts/conformance.sh can exec run-conformance.sh on demand.
        command: [ "sleep", "infinity" ]
        resources: {}
status: {}
