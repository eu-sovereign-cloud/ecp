apiVersion: v1.secapi.cloud/v1
kind: Region
metadata:
  name: "itbg-bergamo"
spec:
  availableZones:
    - "itbg-1"
    - "itbg-2"
  providers:
    - name: "seca.storage"
      url: "http://ecp-regional-gateway-regional:80/providers/seca.storage"
      version: "v1"
    - name: "seca.workspace"
      url: "http://ecp-regional-gateway-regional:80/providers/seca.workspace"
      version: "v1"
    - name: "seca.network"
      url: "http://ecp-regional-gateway-regional:80/providers/seca.network"
      version: "v1"
    - name: "seca.compute"
      url: "http://ecp-regional-gateway-regional:80/providers/seca.compute"
      version: "v1"
---
apiVersion: v1.secapi.cloud/v1
kind: Region
metadata:
  name: "region-two"
spec:
  availableZones:
    - "region-two-a"
  # Served by the SAME regional gateway as itbg-bergamo, under its region path prefix —
  # the single-cluster multi-region topology (see doc/ARCHITECTURE.md, "Multi-region
  # gateways"). The catalog is what tells a client where to send the request, so these
  # URLs are the prefixed ones.
  providers:
    - name: "seca.storage"
      url: "http://ecp-regional-gateway-regional:80/regions/region-two/providers/seca.storage"
      version: "v1"
    - name: "seca.workspace"
      url: "http://ecp-regional-gateway-regional:80/regions/region-two/providers/seca.workspace"
      version: "v1"
