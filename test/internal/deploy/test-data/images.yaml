apiVersion: storage.v1.secapi.cloud/v1
kind: Image
metadata:
  name: ubuntu-24-04
  # hex(sha3-224("test-tenant")) — the ECP namespace for tenant "test-tenant"; see namespace.yaml.
  namespace: f7ec6f666803cd9d9814d4c055217581afbff53f3c35fd6c5e6b444d
  labels:
    base: ubuntu
    version: "24.04"
    # Internal labels the gateway would normally stamp. Without them the REST converter emits a
    # ref with empty tenant/provider ("tenants//ubuntu-24-04"), which downstream dependency
    # resolution can't locate. region must match the regional gateway's --region ("region").
    secapi.cloud/tenant: test-tenant
    secapi.cloud/region: region
    secapi.cloud/provider: seca.storage_v1
spec:
  cpuArchitecture: amd64
  boot: UEFI
  initializer: cloudinit-22
  blockStorageRef:
    resource: block-storages/ubuntu-24-04-src
