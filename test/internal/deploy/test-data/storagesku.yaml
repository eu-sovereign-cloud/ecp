apiVersion: storage.v1.secapi.cloud/v1
kind: StorageSKU
metadata:
  name: sku-1
  # hex(sha3-224("test-tenant")) — the ECP namespace for tenant "test-tenant" (deploy.sh
  # derives and ensures it; see framework/backend/kubernetes/adapter.go ComputeNamespace).
  namespace: f7ec6f666803cd9d9814d4c055217581afbff53f3c35fd6c5e6b444d
  labels:
    # Identity is read back from these labels by StorageSKUFromCR. The provider
    # encodes "/" as "_" because "/" is not a legal label value character.
    secapi.cloud/provider: seca.storage_v1
    secapi.cloud/region: itbg-bergamo
    secapi.cloud/tenant: test-tenant
spec:
  iops: 5000
  minVolumeSize: 1
  type: "local-durable"
---
apiVersion: storage.v1.secapi.cloud/v1
kind: StorageSKU
metadata:
  name: sku-2
  namespace: f7ec6f666803cd9d9814d4c055217581afbff53f3c35fd6c5e6b444d
  labels:
    secapi.cloud/provider: seca.storage_v1
    secapi.cloud/region: itbg-bergamo
    secapi.cloud/tenant: test-tenant
spec:
  iops: 10000
  minVolumeSize: 10
  type: "remote-durable"
