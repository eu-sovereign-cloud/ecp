# The namespace name is the ECP-computed namespace for tenant "test-tenant":
# ComputeNamespace(Scope{Tenant: "test-tenant"}) = hex(sha3-224("test-tenant")).
# For tenant-only scope the hash input is just the tenant; with a workspace it is
# "<tenant>/<workspace>". See framework/backend/kubernetes/adapter.go.
#
# The gateway provisions this namespace on the first tenant-scoped write, so it is NOT
# hand-managed. It is declared here only because kustomize applies the catalog CRs (SKUs,
# images) below before any request reaches the gateway, and they need somewhere to land.
# The owner label must be secapi.cloud/tenant — the key namespaceOwnedBy checks. With any
# other key the controller treats the namespace as foreign and never cleans it up.
apiVersion: v1
kind: Namespace
metadata:
  name: f7ec6f666803cd9d9814d4c055217581afbff53f3c35fd6c5e6b444d
  labels:
    "secapi.cloud/tenant": "test-tenant"
