apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-global-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-global
  template:
    metadata:
      labels:
        app: gateway-global
    spec:
      serviceAccountName: gateway-global-sa
      imagePullSecrets:
      - name: gateway-global-registry-secret
      containers:
      - name: manager
        image: "##IMAGE_NAME##"
        imagePullPolicy: Always
        env:
        # Auth toggle env vars (default: dummy authn + cached authz ON).
        # Override at deploy time to change behaviour without rebuilding the image.
        - name: AUTH_ENABLED
          value: "true"
        # Which authenticator to run: "dummy" (default) or "jwt". Substituted at
        # deploy time from the AUTH_PLUGIN env var; both gateways get the same
        # value so a single stack serves every suite (see test/Makefile).
        - name: AUTH_PLUGIN
          value: "##AUTH_PLUGIN##"
        - name: JWT_SECRET
          value: "/app/jwt.pub"
        - name: AUTHZ_ENABLED
          value: "true"
        - name: AUTHZ_IMPL
          value: "cached"
        # Providers served authn-only (mirrors the binary default): the region
        # catalog is tenant-less by spec, so SECA RBAC does not apply to it.
        - name: AUTHZ_SKIP_PROVIDERS
          value: "seca.region"
        - name: DUMMY_AUTH_USERS
          value: "/app/users.json"
        ports:
        - containerPort: 40000
          name: dlv
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: users
          mountPath: /app/users.json
          subPath: users.json
          readOnly: true
        - name: jwt-key
          mountPath: /app/jwt.pub
          subPath: jwt.pub
          readOnly: true
      volumes:
      - name: users
        configMap:
          name: e2e-dummy-users
      # A Secret, not a ConfigMap: with JWT_SIGNING_METHOD=HS* this file is the
      # shared HMAC secret that mints tokens, not a public key. See jwt-key-secret.yaml.
      - name: jwt-key
        secret:
          secretName: e2e-jwt-key
