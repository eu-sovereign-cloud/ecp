# Secret holding the key the global gateway verifies e2e JWTs with. The matching
# private key is a constant in test/internal/authhelper/authhelpers.go so the suite
# can sign tokens; both are throw-away fixtures generated for this repo.
#
# An ES256 *public* key is not confidential and would be fine in a ConfigMap. It is
# a Secret because this manifest is also the template for JWT_SIGNING_METHOD=HS256,
# where --jwt-secret is the shared HMAC secret that both signs and verifies tokens —
# anyone who can read it can mint a token for any subject. That must never sit in a
# ConfigMap. The gateway takes a file path, so either source mounts identically and
# no code depends on the choice.
#
# WARNING: This key pair is for development and e2e testing only. Its private half
# is published in this repository, so anyone can mint a token that this gateway
# accepts. It must never be used in production.
apiVersion: v1
kind: Secret
metadata:
  name: e2e-jwt-key
type: Opaque
stringData:
  jwt.pub: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEACNi0y/+o+9tCWzA7H6N+dJZm74M
    JtE1SWlrpNk9KnKcKznA9bEWf96/4HZIGhN7xEX9L9xEOxoczKNN5lU1YQ==
    -----END PUBLIC KEY-----
