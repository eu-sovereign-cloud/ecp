{{- if and .Values.gatewayGlobal.enabled .Values.gatewayGlobal.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecp.gatewayGlobal.serviceAccountName" . }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-global
  {{- with .Values.gatewayGlobal.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
