{{- $anyGateway := or .Values.gatewayGlobal.enabled .Values.gatewayRegional.enabled }}
{{- if and .Values.auth.enabled $anyGateway (eq (include "ecp.authPlugin" .) "jwt") (not .Values.auth.jwt.existingSecret) }}
{{- if not .Values.auth.jwt.key }}
{{- fail "auth.plugin=jwt needs a verification key: set auth.jwt.key (PEM public key, or the raw HMAC secret for HS* methods — tip: --set-file auth.jwt.key=key.pem) or auth.jwt.existingSecret" }}
{{- end }}
# Key the gateways verify JWTs with. A Secret rather than a ConfigMap:
# with an HS* signing method this file is the shared HMAC secret that also
# MINTS tokens — anyone who can read it can impersonate any subject.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecp.jwtKeySecretName" . }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt.pub: |
    {{- .Values.auth.jwt.key | nindent 4 }}
{{- end }}
