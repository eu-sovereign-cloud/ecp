  readinessProbe:
    tcpSocket:
      port: http
  # Measured on a KIND run: ~42 MiB RSS idle, ~48 MiB peak under the
  # gateway-global bench (5000 requests). CPU cost is ~4 ms per request, so
  # raise the CPU request if you expect sustained rates above ~25 req/s.
  # Requests only: CPU limits throttle tail latency for no benefit here.
  resources:
    requests:
