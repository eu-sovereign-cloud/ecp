name: Release ecp-delegator-aruba Chart

# Publishes the Aruba Cloud delegator chart (csp/aruba/chart/) on every v* tag.
#
# To give this chart a release cadence independent of the repository's product
# tags, change the filter to a chart-specific prefix (e.g. `aruba-chart-v*`).

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: ./.github/workflows/helm-release.yaml
    with:
      chart-dir: csp/aruba/chart
    permissions:
      contents: write
