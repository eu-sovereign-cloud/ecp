name: Release ecp Chart

# Publishes the ECP gateways chart (chart/) on every v* tag.
#
# To give this chart a release cadence independent of the repository's product
# tags, change the filter to a chart-specific prefix (e.g. `ecp-chart-v*`).

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: ./.github/workflows/helm-release.yaml
    with:
      chart-dir: chart
    permissions:
      contents: write
