apiVersion: apps/v1
kind: Deployment
metadata:
  name: regional-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regional-server
  template:
    metadata:
      labels:
        app: regional-server
    spec:
      # Allow 30s for SIGTERM → httpserver.Serve drain (25s) + process exit.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: registry.secapi.cloud/regional-server:latest
          env:
            - name: REGION
              value: "region"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: regional-server-svc
spec:
  type: NodePort # Expose the service on a port on the node
  selector:
    app: regional-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
