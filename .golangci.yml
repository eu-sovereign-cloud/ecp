version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - importas
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  settings:
    depguard:
      rules:
        # Framework inter-layer DAG (applies when linting framework/* paths).
        # Three-layer DAG: kernel (leaf) ← backend ← (nothing; frontend and backend are peers)
        #
        # These rules live here rather than in a framework/.golangci.yml: golangci-lint's
        # `extends` REPLACES the `linters` block instead of merging into it, so a module-local
        # config that omits `linters.enable` silently drops back to the five default linters —
        # depguard among them — and every rule below goes dead exactly where it was aimed.
        # Scope by path instead; it is false-positive-free and cannot drift out of sync.
        framework-no-resources:
          files:
            - "**/framework/**"
          list-mode: lax
          deny:
            - pkg: "github.com/eu-sovereign-cloud/ecp/resource"
              desc: "framework must not import resources — compiler-enforced via GOWORK=off; this lint catches workspace-masked violations"
        kernel-no-impl:
          files:
            - "**/kernel/**"
          list-mode: lax
          deny:
            - pkg: "github.com/eu-sovereign-cloud/ecp/framework/backend"
              desc: "kernel must not import framework/backend"
            - pkg: "github.com/eu-sovereign-cloud/ecp/framework/frontend"
              desc: "kernel must not import framework/frontend"
        backend-no-frontend:
          files:
            - "**/backend/**"
          list-mode: lax
          deny:
            - pkg: "github.com/eu-sovereign-cloud/ecp/framework/frontend"
              desc: "backend must not import framework/frontend"
        frontend-no-backend:
          files:
            - "**/frontend/**"
          list-mode: lax
          deny:
            - pkg: "github.com/eu-sovereign-cloud/ecp/framework/backend"
              desc: "frontend must not import framework/backend"
        # One assertion toolkit only — see doc/CONVENTIONS.md §9.
        # go-cmp stays allowed outside tests, where it is a diffing library.
        test-toolkit:
          files:
            - "**/*_test.go"
          list-mode: lax
          deny:
            - pkg: "github.com/onsi/gomega"
              desc: "use testify (require/assert); see doc/CONVENTIONS.md §9"
            - pkg: "github.com/onsi/ginkgo"
              desc: "use plain go test with testify; see doc/CONVENTIONS.md §9"
            - pkg: "gotest.tools"
              desc: "use testify (require/assert); see doc/CONVENTIONS.md §9"
            - pkg: "github.com/google/go-cmp/cmp"
              desc: "use testify (require/assert) for assertions; see doc/CONVENTIONS.md §9"
    importas:
      # Enforce <resource><layer> short aliases for resource slices.
      # Per-slice aliases are added in Phase C alongside slice creation.
      # Framework packages use longer descriptive aliases where disambiguation is needed.
      no-unaliased: false
      alias: []
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    exhaustive:
      # A `default` clause counts as handling the rest. Without this, every switch on a domain
      # enum has to name all members even when they share one outcome, which turns into a list
      # that has to be edited whenever a member is added — and gets padded with cases nobody
      # meant to write. The linter still catches a switch that silently drops a new member.
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - preferFprint
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 20
    lll:
      tab-width: 1
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - scopelint
          - unparam
          - unused
        path: _test(ing)?\.go
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - scopelint
          - unparam
          - unused
        path: test_constants.go
      - linters:
          - unused
        path: test*.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      - linters:
          - staticcheck
        text: 'SA3000:'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G104:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
