apiVersion: v2
name: ecp-delegator-aruba
description: >-
  ECP delegator for Aruba Cloud — reconciles ECP Custom Resources through the
  aruba plugin set, writing arubacloud.com CRs for the (separately installed)
  arubacloud-resource-operator. Requires the ECP CRDs (see the ecp chart) in
  the same cluster as the regional gateway.
type: application
version: 0.1.0
appVersion: "v0.1.0-alpha1-preview"
home: https://github.com/eu-sovereign-cloud/ecp
sources:
  - https://github.com/eu-sovereign-cloud/ecp
keywords:
  - seca
  - sovereign-cloud
  - control-plane
  - aruba
