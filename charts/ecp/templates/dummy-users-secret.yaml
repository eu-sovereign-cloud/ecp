{{- $anyGateway := or .Values.gatewayGlobal.enabled .Values.gatewayRegional.enabled }}
{{- if and .Values.auth.enabled $anyGateway (eq (include "ecp.authPlugin" .) "dummy") (not .Values.auth.dummyUsers.existingSecret) }}
{{- if not .Values.auth.dummyUsers.users }}
{{- fail "auth.plugin=dummy needs credentials: set auth.dummyUsers.users (username -> password map) or auth.dummyUsers.existingSecret, or set auth.enabled=false" }}
{{- end }}
# Credentials for the dummy authenticator. The dummy authenticator performs no
# signature verification — development and testing only, never production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecp.dummyUsersSecretName" . }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: {{ .Values.auth.dummyUsers.users | toJson | quote }}
{{- end }}
