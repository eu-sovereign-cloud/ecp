{{- if .Values.gatewayRegional.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecp.gatewayRegional.fullname" . }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-regional
spec:
  type: {{ .Values.gatewayRegional.service.type }}
  ports:
    - name: http
      port: {{ .Values.gatewayRegional.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.gatewayRegional.service.type "NodePort") .Values.gatewayRegional.service.nodePort }}
      nodePort: {{ .Values.gatewayRegional.service.nodePort }}
      {{- end }}
  selector:
    {{- include "ecp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-regional
{{- end }}
